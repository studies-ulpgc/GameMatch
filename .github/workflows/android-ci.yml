name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create dummy local.properties
        run: |
          cat <<'EOF' > local.properties
          IGDB_CLIENT_ID=dummy_id
          IGDB_CLIENT_SECRET=dummy_secret
          EOF

      - name: Run unit tests, JaCoCo, Lint and debug APK build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport lintDebug assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
